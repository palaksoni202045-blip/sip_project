<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Split Expense</title>

<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/split.css">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

</head>

<body>

<div class="split-container">

<h1>👥 Split Expense</h1>

<form>

<label>Expense Title</label>

<input
type="text"
placeholder="Dinner, Trip, Movie...">

<label>Total Amount</label>

<input
type="number"
placeholder="Enter Amount">

<label>Paid By</label>

<select>

<option>You</option>

<option>Rahul</option>

<option>Priya</option>

<option>Aman</option>

</select>

<label>Split Type</label>

<div class="radio-group">

<label>

<input
type="radio"
name="split"
checked>

Equal

</label>

<label>

<input
type="radio"
name="split">

Custom

</label>

</div>

<label>Select Friends</label>

<div class="friends">

<label><input type="checkbox"> Rahul</label>

<label><input type="checkbox"> Priya</label>

<label><input type="checkbox"> Aman</label>

</div>

<button>

Split Expense

</button>

</form>

<div class="summary">

<h2>Split Summary</h2>

<div class="row">

<span>Rahul</span>

<span>₹666.67</span>

</div>

<div class="row">

<span>Priya</span>

<span>₹666.67</span>

</div>

<div class="row">

<span>You</span>

<span>₹666.66</span>

</div>

</div>

</div>

</body>

</html>
