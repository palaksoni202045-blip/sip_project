<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Profile</title>

<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/profile.css">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

</head>

<body>

<div class="profile-container">

<h1>👤 My Profile</h1>

<div class="profile-image">

<img src="https://i.pravatar.cc/150" alt="Profile">

<button>

<i class="fa-solid fa-camera"></i>

Change Photo

</button>

</div>

<form>

<label>Full Name</label>

<input type="text" value="Palak Soni">

<label>Email</label>

<input type="email" value="palak@gmail.com">

<label>Phone Number</label>

<input type="text" value="+91 9876543210">

<label>Date of Birth</label>

<input type="date">

<label>Occupation</label>

<input type="text" value="Student">

<label>City</label>

<input type="text" value="Jaipur">

<button class="save">

Update Profile

</button>

</form>

<div class="stats">

<div class="box">

<h3>Total Balance</h3>

<h2>₹25,000</h2>

</div>

<div class="box">

<h3>Total Expenses</h3>

<h2>₹15,000</h2>

</div>

<div class="box">

<h3>Savings</h3>

<h2>₹10,000</h2>

</div>

</div>

</div>

</body>

</html>
